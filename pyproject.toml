[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a-token-monitor"
version = "0.9.0"
description = "Monitor Codex, Grok, Kimi, DeepSeek Harness and other code agents"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "pantlive", email = "clickly@163.com" },
]
keywords = ["codex", "claude", "kimi", "grok", "token", "usage", "monitor"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/pantlive/a-token-monitor"
Repository = "https://github.com/pantlive/a-token-monitor"
Issues = "https://github.com/pantlive/a-token-monitor/issues"

[project.scripts]
a-token-monitor = "a_token_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 中文注释：Dashboard 页面的 HTML / CSS / JS 资源随包分发。
"a_token_monitor.dashboard" = ["static/*"]

[tool.ruff.lint]
# 中文注释：显式固定规则集（即 ruff 0.15 及以前的默认值）。ruff 0.16 扩大了默认规则，
# 未固定时 CI 装到新版会一下多出数百条报错；新规则以后按需逐个开启。
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# 中文注释：CI 只在 ubuntu / Python 3.13 上统计覆盖率（Windows 会跳过一批平台相关用例）。
branch = true
source = ["a_token_monitor"]

[tool.coverage.report]
# 中文注释：当前行+分支覆盖率约 79%，门槛略低于现状，只防止明显倒退；补测试后再上调。
fail_under = 78
skip_covered = true
show_missing = true

[tool.mypy]
# 中文注释：先覆盖结构最复杂、mixin 最多的几块；其余模块只用于推断类型，
# 不报告它们自身的错误（follow_imports = silent），之后逐步扩大 files。
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
files = [
    "src/a_token_monitor/providers.py",
    "src/a_token_monitor/local_time.py",
    "src/a_token_monitor/usage",
    "src/a_token_monitor/dashboard",
]
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
