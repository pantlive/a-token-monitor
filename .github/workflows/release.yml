# 发布流水线：打 v* 标签后构建 sdist/wheel 并发布到 PyPI。
#
# 使用 PyPI Trusted Publisher（OIDC），不在仓库里保存 API token：
# 需要先在 PyPI 项目设置里把本仓库的 release.yml 登记为 trusted publisher。
# 标签版本必须与 pyproject.toml 的 version 一致（v0.9.0 ↔ 0.9.0），不一致即失败。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: 构建 sdist 与 wheel
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 构建发行包
        run: |
          python -m pip install build
          python -m build

      - name: 校验标签与版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$tag" = "$version"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
