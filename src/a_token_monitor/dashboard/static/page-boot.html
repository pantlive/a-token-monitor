  <script>
    // 分页预置：在首屏绘制前写入 data-page，避免先闪出总览再切到目标页。
    window.__dashboardPages = {
      paths: {
        '/': 'overview',
        '/traffic': 'traffic',
        '/accounts': 'overview',
        '/usage': 'usage',
        '/insights': 'insights',
        '/alerts': 'alert-history',
        '/alert-history': 'alert-history',
        '/search': 'usage-search',
        '/usage-search': 'usage-search',
        '/disk': 'housekeeping',
        '/housekeeping': 'housekeeping',
        '/settings': 'settings'
      },
      titles: {
        overview: '总览',
        traffic: '异常流量监控',
        usage: '用量与费用',
        insights: '习惯分析',
        'alert-history': '告警历史',
        'usage-search': '用量检索',
        housekeeping: '磁盘与会话管理',
        settings: '设置'
      },
      canonical: {
        overview: '/',
        traffic: '/traffic',
        usage: '/usage',
        insights: '/insights',
        'alert-history': '/alerts',
        'usage-search': '/search',
        housekeeping: '/disk',
        settings: '/settings'
      },
      // /accounts 与 #accounts 是总览别名：卡片挂在 KPI 下方，旧书签仍打开总览。
      aliases: {
        accounts: 'overview',
        'account-list': 'overview'
      }
    };
    (() => {
      const pages = window.__dashboardPages;
      const path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      const hash = (window.location.hash || '').replace(/^#/, '');
      const aliased = hash && pages.aliases && pages.aliases[hash];
      const id = aliased || ((hash && pages.canonical[hash]) ? hash : pages.paths[path]);
      document.documentElement.dataset.page = id || 'overview';
    })();
  </script>
